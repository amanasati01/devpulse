services:
  - type: web
    name: devpulse-web
    env: node
    plan: starter
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm db:generate && pnpm db:migrate:deploy && pnpm turbo run build --filter=@devpulse/web
    startCommand: pnpm --filter @devpulse/web start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: devpulse-postgres
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: NEXT_PUBLIC_WS_URL
        sync: false

  - type: worker
    name: devpulse-worker
    env: node
    plan: starter
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm db:generate && pnpm db:migrate:deploy && pnpm turbo run build --filter=@devpulse/worker
    startCommand: pnpm --filter @devpulse/worker start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: devpulse-postgres
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: devpulse-ws
    env: node
    plan: starter
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm db:generate && pnpm turbo run build --filter=@devpulse/ws
    startCommand: pnpm --filter @devpulse/ws start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_URL
        sync: false

databases:
  - name: devpulse-postgres
    plan: starter
